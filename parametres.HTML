<html lang= "fr ">
<head>
  <meta charset= "UTF-8 ">
  <title>Paramètres utilisateur</title>
  <style>
    Body {
      Margin : 0 ;
      Font-family : Arial, sans-serif ;
      Background : linear-gradient(to right, #373B44, #4286f4) ;
      Color : white ;
    }
    Nav {
      Background-color : rgba(0, 0, 0, 0.2) ;
      Padding : 15px ;
      Text-align : center ;
    }
    Nav a {
      Color : white ;
      Margin : 0 15px ;
      Text-decoration : none ;
    }
    Nav a :hover {
      Text-decoration : underline ;
    }
    .container {
      Max-width : 700px ;
      Margin : 50px auto ;
      Background-color : rgba(255, 255, 255, 0.1) ;
      Padding : 30px ;
      Border-radius : 12px ;
    }
    H1 {
      Text-align : center ;
    }
    Label {
      Display : block ;
      Margin-top : 15px ;
    }
    Input, select {
      Width : 100% ;
      Padding : 10px ;
      Margin-top : 5px ;
      Border : none ;
      Border-radius : 5px ;
    }
    Button {
      Margin-top : 20px ;
      Padding : 10px 20px ;
      Background-color : #4CAF50 ;
      Color : white ;
      Border : none ;
      Border-radius : 5px ;
      Cursor : pointer ;
    }
    Button :hover {
      Background-color : #45a049 ;
    }
  </style>
</head>

<input type= "password " id= "password " placeholder= "Nouveau mot de passe ">

</select>
