<h1>Exercice Final : Gestionnaire de Notes (Brython)</h1>

<p>Colle ou modifie ton code ci-dessous, puis clique sur " Exécuter " :</p>

        Return 0
    Return sum(notes.values()) / len(notes)

<button onclick= "runPython() ">Exécuter</button>

<h3>Résultat :</h3>
<pre id= "output "></pre>

<script type= "text/python ">
From browser import document, console
Import builtins

Def runPython(*args) :
    Document[" output "].text =  "" 
    Code = document[" python_code "].value
    Try :
        Exec(code, {" __name__ " : " __main__ "})
    Except Exception as e :
        Document[" output "].text = f "Erreur : {e} "

Document[" runPython "] = runPython
</script>

<script>
Function runPython() {
    Document.getElementById(" output ").innerText = ‘’ ;
    __BRYTHON__.stdin = {
        Buffer : [],
        Readline : function() {
            Let val = prompt(" Entrée utilisateur : ") ;
            This.buffer.push(val) ;
            Return val ;
        }
    } ;
    Try {
        __BRYTHON__.builtins.exec(document.getElementById(" python_code ").value) ;
    } catch (err) {
        Document.getElementById(" output ").innerText = err ;
    }
}
</script>
